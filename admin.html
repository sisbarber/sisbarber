<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookings">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Bookings · Sis Barber Shop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ══════════════════════════════════════════════════════════
   Mobile-first. Minimum 16px body text, 48px touch targets,
   all text ≥ 4.5:1 contrast on black.
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#000; --card:#111113; --card2:#191920; --line:#26262e;
  --text:#fff;            /* 21:1  */
  --text2:#d9d9e0;        /* 15:1  */
  --muted:#a8a8b3;        /* 8.5:1 — smallest text uses this, never darker */
  --blue:#60A5FA;         /* lightened for contrast on black */
  --purple:#C084FC;
  --green:#4ADE80;
  --red:#FB7185;
  --grad:linear-gradient(135deg,#3B82F6,#A855F7);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;line-height:1.5;min-height:100vh;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
button,input,select{font-family:inherit}

/* ══ Login ══ */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:360px;text-align:center}
.gate-logo{font-size:13px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:18px;font-weight:600}
.gate-title{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin-bottom:12px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gate-sub{font-size:17px;color:var(--text2);margin-bottom:28px}
.gate-err{color:var(--red);font-size:16px;margin-top:18px;min-height:44px;line-height:1.5;font-weight:500}

input,select{
  width:100%;padding:17px 18px;background:var(--card);border:2px solid var(--line);
  border-radius:14px;color:var(--text);font-size:17px;outline:none;min-height:56px;
  transition:border-color .18s,box-shadow .18s;
}
input::placeholder{color:var(--muted)}
input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(96,165,250,.2)}
select{appearance:none;padding-right:48px;
  background-image:url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20width%3D%2214%22%20height%3D%228%22%20viewBox%3D%220%200%2014%208%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Cpath%20d%3D%22M1%201l6%206%206-6%22%20stroke%3D%22%23a8a8b3%22%20stroke-width%3D%222%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E");
  background-repeat:no-repeat;background-position:right 18px center}
#key-input{text-align:center;letter-spacing:3px;font-size:19px}

.btn{width:100%;padding:18px;border:none;border-radius:14px;background:var(--grad);
  color:#fff;font-size:17px;font-weight:700;cursor:pointer;min-height:58px;
  transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default}
#login-btn{margin-top:14px}

/* ══ Header ══ */
header{border-bottom:1px solid var(--line);padding:18px 0 15px;margin-bottom:20px;
  position:sticky;top:0;z-index:30;background:rgba(0,0,0,.95);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding-top:calc(18px + env(safe-area-inset-top))}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand span{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:2px;
  text-transform:uppercase;display:block;margin-bottom:3px}
.brand strong{font-size:23px;font-weight:800;letter-spacing:-.5px}
.head-actions{display:flex;gap:10px}
.icon-btn{width:48px;height:48px;border-radius:13px;border:2px solid var(--line);
  background:var(--card);color:var(--text2);font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .18s}
.icon-btn:active{background:var(--card2);color:var(--text)}
.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ Stats ══ */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 8px;text-align:center}
.stat-n{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.stat-l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:9px;font-weight:600}
.blue .stat-n{color:var(--blue)}.purple .stat-n{color:var(--purple)}.white .stat-n{color:var(--text)}

/* ══ Tabs ══ */
.tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:12px 20px;border-radius:999px;border:2px solid var(--line);
  background:transparent;color:var(--text2);font-size:16px;font-weight:600;
  cursor:pointer;white-space:nowrap;min-height:48px;transition:all .18s}
.tab.on{background:#fff;color:#000;border-color:#fff}

/* ══ Cards ══ */
.day-label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;
  margin:26px 0 12px;font-weight:700}
.day-label:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:13px}
.card.done{opacity:.55}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.c-time{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.05}
.c-date{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600}
.pill{font-size:12px;font-weight:700;padding:7px 13px;border-radius:999px;
  text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.p-up{background:rgba(96,165,250,.18);color:var(--blue);border:1px solid rgba(96,165,250,.45)}
.p-done{background:rgba(74,222,128,.16);color:var(--green);border:1px solid rgba(74,222,128,.45)}
.p-cancelled{background:rgba(251,113,133,.16);color:var(--red);border:1px solid rgba(251,113,133,.45)}
.c-name{font-size:21px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.src{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:6px}
.c-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:15px}
.chip{font-size:15px;padding:11px 14px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);color:var(--text2);display:flex;align-items:center;gap:10px}
.chip i{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.chip.b{border-left:4px solid var(--blue)}.chip.b i{color:var(--blue)}
.chip.p{border-left:4px solid var(--purple)}.chip.p i{color:var(--purple)}
.chip.e i{color:var(--muted)}
.c-actions{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:14px}
.act{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--line);background:transparent;
  color:var(--text2);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;
  min-height:52px;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s}
.act:active{background:var(--card2)}
.act.call{color:var(--blue);border-color:rgba(96,165,250,.45)}
.act.wa{color:var(--green);border-color:rgba(74,222,128,.45)}
.act.ok{color:var(--green);border-color:rgba(74,222,128,.45)}
.act.del{color:var(--red);border-color:rgba(251,113,133,.4);flex:0 0 56px}

.empty{text-align:center;padding:64px 20px;color:var(--muted)}
.empty i{font-size:42px;margin-bottom:18px;display:block;opacity:.55}
.empty p{font-size:17px}
.skel{height:200px;background:linear-gradient(90deg,var(--card),#1c1c22,var(--card));
  background-size:200% 100%;animation:sh 1.3s infinite;border-radius:18px;margin-bottom:13px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ══ FAB ══ */
.fab{position:fixed;left:50%;transform:translateX(-50%);z-index:40;
  bottom:calc(26px + env(safe-area-inset-bottom));
  padding:18px 30px;border-radius:999px;border:none;cursor:pointer;min-height:60px;
  background:var(--grad);color:#fff;font-size:17px;font-weight:700;
  box-shadow:0 10px 32px rgba(59,130,246,.45);display:flex;align-items:center;gap:10px;
  transition:transform .12s}
.fab:active{transform:translateX(-50%) scale(.96)}

/* ══ Modal ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#0A0A0C;border:1px solid var(--line);border-radius:26px 26px 0 0;
  width:100%;max-width:540px;max-height:94vh;overflow-y:auto;
  padding:26px 18px calc(36px + env(safe-area-inset-bottom));
  animation:up .28s cubic-bezier(.16,1,.3,1);-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.sheet-title{font-size:26px;font-weight:800;letter-spacing:-.6px}
.field{margin-bottom:16px}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;
  margin-bottom:9px;display:block;font-weight:700}
.label .opt{color:#6b6b78;text-transform:none;letter-spacing:0;font-weight:500}
.form-err{color:var(--red);font-size:16px;margin:14px 0 4px;min-height:24px;line-height:1.5;font-weight:500}
.hint{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6;text-align:center}

/* ══ Toast ══ */
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
  bottom:calc(104px + env(safe-area-inset-bottom));
  padding:16px 24px;border-radius:14px;font-size:16px;font-weight:600;
  max-width:92vw;text-align:center;animation:pop .24s cubic-bezier(.16,1,.3,1)}
.toast.ok{background:#04351b;color:var(--green);border:1px solid rgba(74,222,128,.5)}
.toast.bad{background:#3a0d15;color:var(--red);border:1px solid rgba(251,113,133,.5)}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(12px)}
               to{opacity:1;transform:translateX(-50%) translateY(0)}}

@media (min-width:600px){
  .c-meta{flex-direction:row;flex-wrap:wrap}
  .chip{flex:0 1 auto}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">Sis Barber Shop</div>
    <div class="gate-title">Bookings</div>
    <div class="gate-sub">Enter your access key</div>
    <input type="text" id="key-input" placeholder="access key" autocomplete="off"
           autocorrect="off" autocapitalize="off" spellcheck="false" name="sis-access-key">
    <button class="btn" id="login-btn">Unlock</button>
    <div class="gate-err" id="gate-err" role="alert"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="wrap head-row">
      <div class="brand"><span>Sis Barber Shop</span><strong>Bookings</strong></div>
      <div class="head-actions">
        <button class="icon-btn" id="refresh-btn" aria-label="Refresh bookings"><i class="fa-solid fa-rotate-right"></i></button>
        <button class="icon-btn" id="logout-btn" aria-label="Lock dashboard"><i class="fa-solid fa-lock"></i></button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="stat blue"><div class="stat-n" id="s-today">–</div><div class="stat-l">Today</div></div>
      <div class="stat purple"><div class="stat-n" id="s-tom">–</div><div class="stat-l">Tomorrow</div></div>
      <div class="stat white"><div class="stat-n" id="s-week">–</div><div class="stat-l">7 Days</div></div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab on" data-f="today">Today</button>
      <button class="tab" data-f="tomorrow">Tomorrow</button>
      <button class="tab" data-f="upcoming">Upcoming</button>
      <button class="tab" data-f="past">Past</button>
      <button class="tab" data-f="customers">Customers</button>
      <button class="tab" data-f="archive">Archive</button>
    </div>

    <div id="list"></div>
  </div>

  <button class="fab" id="add-btn"><i class="fa-solid fa-plus"></i> New Booking</button>
</div>

<!-- ══ CUSTOMER PROFILE ══ -->
<div class="overlay hidden" id="cust-modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title" id="cust-name">Customer</div>
      <button class="icon-btn" id="close-cust" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cust-body"></div>
  </div>
</div>

<div class="overlay hidden" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <div class="sheet-title">New Booking</div>
      <button class="icon-btn" id="close-modal" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <div class="field">
      <label class="label" for="f-name">Customer name</label>
      <input type="text" id="f-name" placeholder="Full name" autocomplete="off">
    </div>
    <div class="field">
      <label class="label" for="f-phone">Phone</label>
      <input type="tel" id="f-phone" placeholder="07…" autocomplete="off" inputmode="tel">
    </div>
    <div class="field">
      <label class="label" for="f-email">Email <span class="opt">(optional)</span></label>
      <input type="email" id="f-email" placeholder="name@email.com" autocomplete="off" inputmode="email">
    </div>
    <div class="field">
      <label class="label" for="f-service">Service</label>
      <select id="f-service"></select>
    </div>
    <div class="field">
      <label class="label" for="f-barber">Barber</label>
      <select id="f-barber"></select>
    </div>
    <div class="field">
      <label class="label" for="f-date">Date</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label class="label" for="f-time">Time</label>
      <select id="f-time"></select>
    </div>

    <div class="form-err" id="form-err" role="alert"></div>
    <button class="btn" id="save-btn">Confirm Booking</button>
    <div class="hint">If you add an email, the customer gets a confirmation automatically.</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
const API = 'https://script.google.com/macros/s/AKfycbx8lKSjdcW1Z_a12EXLVGIHmBast8b4L3AYw6AkVW4fGojmAH0yIeaABazV0t5CVzIr/exec';
// ═══════════════════════════════════════════════════════════

const WA_CC = '44';
let KEY = localStorage.getItem('sis_admin_key') || '';
let BOOKINGS = [], CFG = null, FILTER = 'today', LAST_ERR = '';

const $ = id => document.getElementById(id);
const gate = $('gate'), app = $('app'), modal = $('modal');

const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = iso(new Date());
const TOM = (()=>{const d=new Date();d.setDate(d.getDate()+1);return iso(d);})();
const WEEK = (()=>{const d=new Date();d.setDate(d.getDate()+7);return iso(d);})();

function timeVal(t){
  const m = String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(!m) return 0;
  let h = +m[1]; const mm = +m[2], ap = (m[3]||'').toUpperCase();
  if(ap==='PM' && h!==12) h+=12;
  if(ap==='AM' && h===12) h=0;
  return h*60+mm;
}
function minToTime(min){
  const h=Math.floor(min/60), m=min%60, ap=h>=12?'PM':'AM', hh=h%12||12;
  return String(hh).padStart(2,'0')+':'+String(m).padStart(2,'0')+' '+ap;
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, ok=true){
  const t=document.createElement('div');
  t.className='toast '+(ok?'ok':'bad'); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3400);
}

async function api(params){
  const qs = new URLSearchParams(Object.assign({key:KEY,t:Date.now()}, params||{}));
  const r = await fetch(API+'?'+qs.toString());
  return await r.json();
}

async function load(key){
  try{
    const r = await fetch(API+'?key='+encodeURIComponent(key)+'&t='+Date.now());
    const d = await r.json();
    if(!d.ok){ LAST_ERR = d.error==='unauthorised' ? 'Wrong key — try again' : ('Server: '+(d.error||'?')); return false; }
    LAST_ERR='';
    BOOKINGS = (d.bookings||[]).sort((a,b)=>
      a.iso!==b.iso ? (a.iso||'').localeCompare(b.iso||'') : timeVal(a.time)-timeVal(b.time));
    return true;
  }catch(e){ LAST_ERR='Connection failed — '+e.message; return false; }
}

async function loadConfig(){
  try{ const d = await api({action:'config'}); if(d.ok){ CFG=d; buildForm(); } }
  catch(e){ console.warn('config',e); }
}

$('login-btn').onclick = tryLogin;
$('key-input').onkeydown = e => { if(e.key==='Enter') tryLogin(); };

async function tryLogin(){
  const val = $('key-input').value.trim();
  if(!val){ $('gate-err').textContent='Enter your key'; return; }
  $('login-btn').disabled=true; $('login-btn').textContent='Checking…'; $('gate-err').textContent='';
  const ok = await load(val);
  $('login-btn').disabled=false; $('login-btn').textContent='Unlock';
  if(ok){
    KEY=val; localStorage.setItem('sis_admin_key',val);
    gate.classList.add('hidden'); app.classList.remove('hidden');
    render(); loadConfig();
  } else $('gate-err').textContent = LAST_ERR || 'Wrong key — try again';
}

$('logout-btn').onclick = () => { localStorage.removeItem('sis_admin_key'); location.reload(); };
$('refresh-btn').onclick = async () => {
  const ic=$('refresh-btn').querySelector('i'); ic.classList.add('spin');
  await load(KEY); ic.classList.remove('spin'); render();
};
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); FILTER=t.dataset.f; render();
  };
});

async function setStatus(row, value){
  const b = BOOKINGS.find(x=>x.row===row); const prev = b?b.status:null;
  if(b) b.status=value; render();
  try{
    const d = await api({action:'status',row:row,value:value});
    if(!d.ok) throw new Error(d.error||'failed');
  }catch(e){ if(b) b.status=prev; render(); toast('Could not update — '+e.message,false); }
}

async function del(row){
  if(!confirm('Move this booking to the Archive?\n\nYou can restore it later from the Archive tab.')) return;
  try{
    const d = await api({action:'delete',row:row});
    if(!d.ok) throw new Error(d.error||'failed');
    await load(KEY); render(); toast('Moved to Archive');
  }catch(e){ toast('Could not archive — '+e.message,false); }
}

async function restore(row){
  try{
    const d = await api({action:'restore',row:row});
    if(!d.ok) throw new Error(d.error||'failed');
    await load(KEY); render(); toast('Booking restored');
  }catch(e){ toast('Could not restore — '+e.message,false); }
}

async function destroy(row){
  if(!confirm('Permanently delete this booking?\n\nThis erases it from the records and cannot be undone.')) return;
  try{
    const d = await api({action:'destroy',row:row});
    if(!d.ok) throw new Error(d.error||'failed');
    await load(KEY); render(); toast('Permanently deleted');
  }catch(e){ toast('Could not delete — '+e.message,false); }
}

/* ── Customer intelligence ───────────────────────────────── */
function priceOf(service){
  if(!CFG || !CFG.services) return 0;
  const s = CFG.services.find(x=>x[0]===service);
  return s && s[2] ? s[2] : 0;
}

function custKey(b){ return String(b.phone||'').replace(/\D/g,'') || ('e:'+String(b.email||'').toLowerCase()); }

/** Groups every booking by person and works out their history. */
function buildCustomers(){
  const map = new Map();
  BOOKINGS.forEach(b => {
    if(b.status==='Deleted') return;
    const k = custKey(b);
    if(!k) return;
    if(!map.has(k)) map.set(k, {key:k, name:b.name, phone:b.phone, email:b.email, visits:[]});
    const c = map.get(k);
    c.visits.push(b);
    if(b.email && !c.email) c.email = b.email;
    if((b.name||'').length > (c.name||'').length) c.name = b.name;
  });

  const out = [];
  map.forEach(c => {
    c.visits.sort((a,b)=> (b.iso||'').localeCompare(a.iso||''));
    const done = c.visits.filter(v=>v.status==='Done');
    const upcoming = c.visits.filter(v=>v.iso>=TODAY && v.status!=='Cancelled');
    const past = c.visits.filter(v=>v.iso<TODAY);
    c.total   = done.reduce((s,v)=>s+priceOf(v.service),0);
    c.count   = c.visits.length;
    c.doneCount = done.length;
    c.pastCount = past.length;
    c.upcoming  = upcoming.length;
    c.lastVisit = past.length ? past[0] : null;
    // most frequent service / barber
    const tally = (arr,f)=>{const m={};arr.forEach(v=>{const k=f(v); if(k) m[k]=(m[k]||0)+1;});
      return Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||'';};
    c.usualService = tally(c.visits, v=>v.service);
    c.usualBarber  = tally(c.visits, v=>v.barber);
    c.noShows = c.visits.filter(v=>v.status==='No-show').length;
    out.push(c);
  });
  out.sort((a,b)=> b.count - a.count || (b.total - a.total));
  return out;
}

function openCustomer(key){
  const c = buildCustomers().find(x=>x.key===key);
  if(!c) return;
  $('cust-name').textContent = c.name;

  const stat = (n,l,col) =>
    `<div class="stat"><div class="stat-n" style="color:${col};font-size:28px">${n}</div><div class="stat-l">${l}</div></div>`;

  let html = `<div class="stats" style="margin-bottom:20px">
      ${stat(c.count,'Bookings','var(--blue)')}
      ${stat(c.doneCount,'Completed','var(--purple)')}
      ${stat('£'+c.total,'Spent','var(--text)')}
    </div>`;

  html += `<div class="c-meta" style="margin-bottom:20px">
      <div class="chip e"><i class="fa-solid fa-phone"></i><span>${esc(c.phone)}</span></div>
      ${c.email?`<div class="chip e"><i class="fa-solid fa-envelope"></i><span>${esc(c.email)}</span></div>`:''}
      ${c.usualService?`<div class="chip b"><i class="fa-solid fa-scissors"></i><span>Usually: ${esc(c.usualService)}</span></div>`:''}
      ${c.usualBarber?`<div class="chip p"><i class="fa-solid fa-user"></i><span>Usually with ${esc(c.usualBarber)}</span></div>`:''}
    </div>`;

  html += `<div style="display:flex;gap:9px;margin-bottom:22px">
      <a class="act call" href="tel:${esc(String(c.phone).replace(/\s/g,''))}"><i class="fa-solid fa-phone"></i>Call</a>
      <a class="act wa" href="${esc(waLink(c.phone,c.name,'',''))}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>WhatsApp</a>
      <button class="act ok" onclick="rebook('${c.key}')"><i class="fa-solid fa-rotate-right"></i>Rebook</button>
    </div>`;

  html += `<div class="day-label">Visit history</div>`;
  c.visits.forEach(v => {
    const st = v.status||'Upcoming';
    const pill = st==='Done'?'p-done':st==='Cancelled'||st==='No-show'?'p-cancelled':'p-up';
    html += `<div class="card" style="padding:14px;margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div>
            <div style="font-size:16px;font-weight:700">${esc(v.date)}</div>
            <div style="font-size:14px;color:var(--text2);margin-top:4px">${esc(v.time)} · ${esc(v.service)} · ${esc(v.barber)}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div class="pill ${pill}">${esc(st)}</div>
            <div style="font-size:15px;color:var(--muted);margin-top:6px">£${priceOf(v.service)}</div>
          </div>
        </div>
      </div>`;
  });

  $('cust-body').innerHTML = html;
  $('cust-modal').classList.remove('hidden');
}

function rebook(key){
  const c = buildCustomers().find(x=>x.key===key);
  if(!c) return;
  $('cust-modal').classList.add('hidden');
  if(!CFG) { loadConfig(); } else { buildForm(); }
  $('f-name').value  = c.name;
  $('f-phone').value = c.phone;
  $('f-email').value = c.email || '';
  if(c.usualService) $('f-service').value = c.usualService;
  if(c.usualBarber)  $('f-barber').value  = c.usualBarber;
  buildTimes();
  $('form-err').textContent = '';
  modal.classList.remove('hidden');
}

$('close-cust').onclick = () => $('cust-modal').classList.add('hidden');
$('cust-modal').onclick = e => { if(e.target===$('cust-modal')) $('cust-modal').classList.add('hidden'); };

function waLink(phone,name,date,time){
  let p=String(phone||'').replace(/\D/g,'');
  if(p.startsWith('0')) p = WA_CC+p.slice(1);
  const msg = `Hi ${name}, this is Sis Barber Shop confirming your appointment on ${date} at ${time}. See you soon!`;
  return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg);
}

function render(){
  const live = b => b.status!=='Cancelled' && b.status!=='Deleted';
  $('s-today').textContent = BOOKINGS.filter(b=>b.iso===TODAY && live(b)).length;
  $('s-tom').textContent   = BOOKINGS.filter(b=>b.iso===TOM && live(b)).length;
  $('s-week').textContent  = BOOKINGS.filter(b=>b.iso>=TODAY && b.iso<=WEEK && live(b)).length;

  const list = $('list');
  const alive = b => b.status!=='Deleted';

  // ── Customers view ──
  if(FILTER==='customers'){
    const cs = buildCustomers();
    if(!cs.length){ list.innerHTML = `<div class="empty"><i class="fa-regular fa-user"></i><p>No customers yet</p></div>`; return; }
    list.innerHTML = `<div class="day-label">${cs.length} customer${cs.length===1?'':'s'} · most frequent first</div>` +
      cs.map(c => `
        <div class="card" onclick="openCustomer('${c.key}')" style="cursor:pointer">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
            <div style="min-width:0">
              <div class="c-name" style="margin-bottom:6px">${esc(c.name)}
                ${c.count>=3?'<span class="src" style="color:var(--purple);border-color:var(--purple)">Regular</span>':''}
                ${c.noShows?'<span class="src" style="color:var(--red);border-color:var(--red)">'+c.noShows+' no-show</span>':''}
              </div>
              <div style="font-size:15px;color:var(--text2)">
                ${c.count} booking${c.count===1?'':'s'} · £${c.total} spent
                ${c.upcoming?' · <span style="color:var(--blue)">'+c.upcoming+' upcoming</span>':''}
              </div>
              ${c.usualService?`<div style="font-size:14px;color:var(--muted);margin-top:5px">${esc(c.usualService)} · ${esc(c.usualBarber)}</div>`:''}
            </div>
            <i class="fa-solid fa-chevron-right" style="color:var(--muted);flex-shrink:0"></i>
          </div>
        </div>`).join('');
    return;
  }

  // ── Booking views ──
  let rows = BOOKINGS.filter(alive);
  let emptyWord = 'yet';
  if(FILTER==='today')    { rows = rows.filter(b=>b.iso===TODAY); emptyWord='today'; }
  if(FILTER==='tomorrow') { rows = rows.filter(b=>b.iso===TOM);   emptyWord='tomorrow'; }
  if(FILTER==='upcoming') { rows = rows.filter(b=>b.iso>=TODAY); }
  if(FILTER==='past')     { rows = rows.filter(b=>b.iso<TODAY).reverse(); emptyWord='in the past'; }
  if(FILTER==='archive')  { rows = BOOKINGS.filter(b=>b.status==='Deleted').reverse(); emptyWord='in the archive'; }

  if(!rows.length){
    const icon = FILTER==='archive' ? 'fa-solid fa-box-archive' : 'fa-regular fa-calendar';
    list.innerHTML = `<div class="empty"><i class="${icon}"></i><p>Nothing ${emptyWord}</p></div>`;
    return;
  }

  // Past and Archive get a takings summary
  if(FILTER==='past' || FILTER==='archive'){
    const done = rows.filter(b=>b.status==='Done');
    const takings = done.reduce((s,b)=>s+priceOf(b.service),0);
    list.innerHTML = `<div class="stats" style="margin-bottom:20px">
        <div class="stat blue"><div class="stat-n">${rows.length}</div><div class="stat-l">Bookings</div></div>
        <div class="stat purple"><div class="stat-n">${done.length}</div><div class="stat-l">Completed</div></div>
        <div class="stat white"><div class="stat-n">£${takings}</div><div class="stat-l">Takings</div></div>
      </div>`;
  } else {
    list.innerHTML = '';
  }

  // How many times has this person booked? Drives the "Regular" badge.
  const counts = {};
  BOOKINGS.filter(alive).forEach(b=>{ const k=custKey(b); if(k) counts[k]=(counts[k]||0)+1; });

  let html='', lastDay=null;
  const grouped = FILTER!=='today' && FILTER!=='tomorrow';

  rows.forEach(b => {
    if(grouped && b.date!==lastDay){
      html += `<div class="day-label">${esc(b.date)||'No date'}</div>`; lastDay=b.date;
    }
    const st = b.status||'Upcoming';
    const pill = st==='Done'?'p-done':(st==='Cancelled'||st==='No-show'||st==='Deleted')?'p-cancelled':'p-up';
    const phone = String(b.phone||'').replace(/\s/g,'');
    const k = custKey(b);
    const isRegular = counts[k] >= 3;
    const archived = st==='Deleted';

    html += `
    <div class="card ${st!=='Upcoming'?'done':''}">
      <div class="card-top">
        <div><div class="c-time">${esc(b.time)}</div><div class="c-date">${esc(b.date)}</div></div>
        <div style="text-align:right;flex-shrink:0">
          <div class="pill ${pill}">${esc(archived?'Archived':st)}</div>
          <div style="font-size:15px;color:var(--muted);margin-top:7px">£${priceOf(b.service)}</div>
        </div>
      </div>
      <div class="c-name" ${k?`onclick="openCustomer('${k}')" style="cursor:pointer"`:''}>${esc(b.name)}
        ${isRegular?'<span class="src" style="color:var(--purple);border-color:var(--purple)">Regular</span>':''}
        ${b.source==='Phone'?'<span class="src">Phone</span>':''}
      </div>
      <div class="c-meta">
        <div class="chip b"><i class="fa-solid fa-scissors"></i><span>${esc(b.service)}</span></div>
        <div class="chip p"><i class="fa-solid fa-user"></i><span>${esc(b.barber)}</span></div>
        <div class="chip e"><i class="fa-solid fa-phone"></i><span>${esc(b.phone)}</span></div>
        ${b.email?`<div class="chip e"><i class="fa-solid fa-envelope"></i><span>${esc(b.email)}</span></div>`:''}
      </div>
      <div class="c-actions">
        ${archived ? `
          <button class="act ok" onclick="restore(${b.row})"><i class="fa-solid fa-rotate-left"></i>Restore</button>
          <button class="act del" onclick="destroy(${b.row})" style="flex:1"><i class="fa-solid fa-trash"></i>Delete forever</button>
        ` : `
          <a class="act call" href="tel:${esc(phone)}"><i class="fa-solid fa-phone"></i>Call</a>
          <a class="act wa" href="${esc(waLink(b.phone,b.name,b.date,b.time))}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>WhatsApp</a>
          ${st==='Upcoming'
            ? `<button class="act ok" onclick="setStatus(${b.row},'Done')"><i class="fa-solid fa-check"></i>Done</button>`
            : `<button class="act" onclick="setStatus(${b.row},'Upcoming')"><i class="fa-solid fa-rotate-left"></i>Undo</button>`}
          <button class="act del" onclick="del(${b.row})" aria-label="Archive booking"><i class="fa-solid fa-box-archive"></i></button>
        `}
      </div>
    </div>`;
  });
  list.innerHTML += html;
}

function buildForm(){
  if(!CFG) return;
  $('f-service').innerHTML = CFG.services.map(s=>`<option value="${esc(s[0])}">${esc(s[0])}</option>`).join('');
  $('f-barber').innerHTML  = '<option value="">Anyone available</option>' +
    CFG.barbers.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('');
  $('f-date').min = TODAY;
  if(!$('f-date').value) $('f-date').value = TODAY;
  buildTimes();
}

function buildTimes(){
  if(!CFG) return;
  const dv = $('f-date').value;
  if(!dv){ $('f-time').innerHTML='<option value="">Pick a date</option>'; return; }
  const p = dv.split('-');
  const dow = new Date(+p[0],+p[1]-1,+p[2]).getDay();
  const hrs = CFG.hours[dow] || CFG.hours[1];
  const svc = $('f-service').value;
  const dur = (CFG.services.find(s=>s[0]===svc)||[null,30])[1];
  let opts='';
  for(let m=hrs.open; m+dur<=hrs.close; m+=30) opts += `<option value="${minToTime(m)}">${minToTime(m)}</option>`;
  $('f-time').innerHTML = opts || '<option value="">Closed that day</option>';
}

$('f-date').onchange = buildTimes;
$('f-service').onchange = buildTimes;

$('add-btn').onclick = () => {
  $('form-err').textContent='';
  if(!CFG) loadConfig(); else buildForm();
  modal.classList.remove('hidden');
};
$('close-modal').onclick = () => modal.classList.add('hidden');
modal.onclick = e => { if(e.target===modal) modal.classList.add('hidden'); };

$('save-btn').onclick = async () => {
  const payload = {
    action:'create',
    name:$('f-name').value.trim(), phone:$('f-phone').value.trim(),
    email:$('f-email').value.trim(), service:$('f-service').value,
    barber:$('f-barber').value, date_iso:$('f-date').value, time:$('f-time').value
  };
  if(!payload.name)  return ($('form-err').textContent='Customer name is required');
  if(!payload.phone) return ($('form-err').textContent='Phone number is required');
  if(!payload.time)  return ($('form-err').textContent='Pick a time');

  $('save-btn').disabled=true; $('save-btn').textContent='Saving…'; $('form-err').textContent='';
  try{
    const d = await api(payload);
    if(!d.ok) throw new Error(d.error||'Could not save');
    modal.classList.add('hidden');
    ['f-name','f-phone','f-email'].forEach(id=>$(id).value='');
    await load(KEY); render();
    toast('Booking added for '+d.booking.name);
  }catch(e){ $('form-err').textContent = e.message; }
  finally{ $('save-btn').disabled=false; $('save-btn').textContent='Confirm Booking'; }
};

(async () => {
  if(!KEY) return;
  gate.classList.add('hidden'); app.classList.remove('hidden');
  $('list').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const ok = await load(KEY);
  if(!ok){
    localStorage.removeItem('sis_admin_key');
    app.classList.add('hidden'); gate.classList.remove('hidden');
    $('gate-err').textContent = LAST_ERR; return;
  }
  render(); loadConfig();
  setInterval(async()=>{ if(document.visibilityState==='visible'){ await load(KEY); render(); } },60000);
})();
</script>
